<!DOCTYPE html>
<head>
<style>

path.link {
  fill: none;
  stroke: #666;
  stroke-width: 1.5px;
}

path.link.value-0 {
    stroke: gray;
    stroke-width: 3px;
    stroke-dasharray: none;
}

path.link.value-1 {
    stroke: green;
    stroke-width: 1.5px;
    stroke-dasharray: 5, 5;
}

circle {
  fill: #ccc;
  stroke: #fff;
  stroke: black;
  stroke-width: 1.5px;
}

text {
  fill: #000;
  font: 10px sans-serif;
  pointer-events: none;
}

#credit {
  font-size: 14px;
  font-weight: bold;
}

</style>
<meta charset="utf-8">
<title>Board Game Force-Directed Graph</title>
</head>

<body>
<script type="text/javascript" src="../lib/d3.v5.min.js"></script>
<script>

d3.dsv(",", "board_games.csv", function(d) {
  return {
    source: d.source,
    target: d.target,
    value: +d.value
  }
}).then(function(data) {

  var links = data
  var nodes = {};
  console.table(data);
  
 //Populate the graph nodes.
  links.forEach(function(link) {
    link.source = nodes[link.source] ||
      (nodes[link.source] = {name: link.source});
    link.target = nodes[link.target] ||
      (nodes[link.target] = {name: link.target});
  });  

  //Precompute the degree per node for calculations of node size + color.
  links.forEach(function(link) {
     link.source.degree = (link.source.degree === undefined ? 0 : link.source.degree) + 1;
     link.target.degree = (link.target.degree === undefined ? 0 : link.target.degree) + 1;
  });

  //Calculate the max-min degree range for the graph.
  var degrees = d3.values(nodes).map(function(d) {
        return d.degree;
    });

   var minDegree = d3.min(degrees);
   var maxDegree = d3.max(degrees);

   // Debugging: verify degree values.
console.log("Degrees:", degrees);
console.log("Minimum:", minDegree, "Maximum:", maxDegree);


   
   //Use the degree range to scale the radius appropriately.
   var radiusScale = d3.scaleSqrt()
        .domain([minDegree, maxDegree])
        .range([5, 18]);
   
   //Define the shades of the purple color.
   var colorScale = d3.scaleQuantize()
        .domain([minDegree, maxDegree])
        .range([
            "#E1BEE7",
            "#BA68C8",
            "#8E24AA",
            "#4A148C"
        ]);


  var width = 1200,
      height = 700;

  //DO NOT MODIFY THE BELOW BLOCK OF CODE//
  var force = d3.forceSimulation()
      .nodes(d3.values(nodes))
      .force("link", d3.forceLink(links).distance(100))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force("x", d3.forceX())
      .force("y", d3.forceY())
      .force("charge", d3.forceManyBody().strength(-250))
      .alphaTarget(1)
      .on("tick", tick);
  //DO NOT MODIFY THE ABOVE BLOCK OF CODE//

  var svg = d3.select("body").append("svg")
      .attr("width", width)
      .attr("height", height);

  // add the links
  var path = svg.append("g")
      .selectAll("path")
      .data(links)
      .enter()
      .append("path")
      .attr("class", function(d) { return "link value-" + d.value; });

  // define the nodes
  var node = svg.selectAll(".node")
      .data(force.nodes())
      .enter().append("g")
      .attr("class", "node")
      .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended)).on("dblclick", dblclicked);

  // add the nodes and be sure to not have duplicate of this section
  node.append("circle")
      .attr("id", function(d){
         return (d.name.replace(/\s+/g,'').toLowerCase());
      })
      .attr("r", function(d) {
            return radiusScale(d.degree);
        })
      .style("fill", function(d) {
          return colorScale(d.degree);
      });
  
  
  //We will add the node label per board game node.
  node.append("text")
    .attr("dx", function(d) {
            return radiusScale(d.degree) + 3;
        })
    .attr("dy", function(d) {
            return -radiusScale(d.degree) - 3;
        })
    .style("font-weight", "bold")
    .text(function(d) {
        return d.name;
    });

  //Add my username in the top right corner of the graph.
  svg.append("text")
        .attr("id", "credit")
        .attr("x", width - 100)
        .attr("y", 24)
        .attr("text-anchor", "end")
        .text("nmunagala3");

  // add the curvy lines
  function tick() {
      path.attr("d", function(d) {
          var dx = d.target.x - d.source.x,
              dy = d.target.y - d.source.y,
              dr = Math.sqrt(dx * dx + dy * dy);
          return "M" +
              d.source.x + "," +
              d.source.y + "A" +
              dr + "," + dr + " 0 0,1 " +
              d.target.x + "," +
              d.target.y;
      });

      node.attr("transform", function(d) {
          return "translate(" + d.x + "," + d.y + ")"; 
      });
  };

  function dragstarted(d) {
      if (!d3.event.active) force.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
  };

  function dragged(d) {
      d.fx = d3.event.x;
      d.fy = d3.event.y;
  };

  function dragended(d) {
      if (!d3.event.active) force.alphaTarget(0);
      d.fixed = true;
      d.fx = d.x;
      d.fy = d.y;
      d3.select(this).classed("fixed", true);
  };

  //Function that reverse clicks the  
  function dblclicked(d) {
        // Release a pinned node back into the simulation.
        d.fixed = false;
        d.fx = null;
        d.fy = null;
        d3.select(this).classed("fixed", false);
        force.alpha(0.3).restart();
      }
    }).catch(function(error) {
  console.log(error);
});

</script>
</body>
</html>
